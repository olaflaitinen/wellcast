site_name: wellcast
site_description: Oil and gas well performance analysis for Python
site_author: Olaf Yunus Laitinen Imanov
site_url: https://olaflaitinen.github.io/wellcast/
repo_url: https://github.com/olaflaitinen/wellcast
repo_name: olaflaitinen/wellcast
edit_uri: edit/main/docs/
copyright: Copyright (c) 2026 Olaf Yunus Laitinen Imanov, Mozilla Public License 2.0

theme:
  name: material
  logo: assets/icon.svg
  favicon: assets/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

hooks:
  - scripts/mkdocs_hooks.py

plugins:
  - search
  - mkdocs-jupyter:
      execute: true
      include_source: true
      include_requirejs: true
      allow_errors: false
      # The cache key ignores the environment (PLOTLY_RENDERER); always execute.
      cache: false
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            merge_init_into_class: true
            filters: ["!^_"]

nav:
  - Home: index.md
  - Installation: installation.md
  - Quickstart: quickstart.md
  - User Guide:
      - Overview: user-guide/index.md
      - Units: user-guide/units.md
      - Data input: user-guide/io.md
      - Cleaning and QC: user-guide/clean.md
      - Synthetic data: user-guide/datasets.md
      - PVT: user-guide/pvt.md
      - Inflow and chokes: user-guide/ipr.md
      - Decline curves: user-guide/dca.md
      - Features: user-guide/features.md
      - Machine learning: user-guide/ml.md
      - Diagnostics: user-guide/diagnostics.md
      - Plotting: user-guide/plotting.md
  - Tutorials:
      - Quickstart: tutorials/01_quickstart.ipynb
      - Decline curve analysis: tutorials/02_decline_curve_analysis.ipynb
      - Virtual flow metering: tutorials/03_virtual_flow_metering.ipynb
  - API Reference:
      - wellcast: api/index.md
      - units: api/units.md
      - io: api/io.md
      - clean: api/clean.md
      - datasets: api/datasets.md
      - pvt: api/pvt.md
      - ipr: api/ipr.md
      - dca: api/dca.md
      - features: api/features.md
      - ml: api/ml.md
      - diagnostics: api/diagnostics.md
      - plotting: api/plotting.md
      - cli: api/cli.md
      - exceptions: api/exceptions.md
  - CLI: cli.md
  - App: app.md
  - License: license.md
  - About: about.md
