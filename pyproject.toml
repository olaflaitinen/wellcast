[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "wellcast"
dynamic = ["version"]
description = "Oil and gas well performance analysis: data QC, decline curves, PVT, IPR, diagnostics and machine learning."
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "Olaf Yunus Laitinen Imanov", email = "yunus.z.imanov@helsinki.fi" },
]
maintainers = [
  { name = "Olaf Yunus Laitinen Imanov", email = "yunus.z.imanov@helsinki.fi" },
]
keywords = [
  "petroleum engineering",
  "reservoir engineering",
  "production engineering",
  "oil and gas",
  "decline curve analysis",
  "PVT",
  "IPR",
  "virtual flow metering",
  "well performance",
  "machine learning",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
]

[project.optional-dependencies]
io = ["lasio>=0.31", "openpyxl>=3.1"]
ml = ["scikit-learn>=1.3", "lightgbm>=4.0", "shap>=0.44", "joblib>=1.3"]
viz = ["plotly>=5.18"]
app = ["streamlit>=1.32", "plotly>=5.18"]
all = ["wellcast[io,ml,viz,app]"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.10",
  "pandas-stubs>=2.0",
  "scipy-stubs>=1.14",
  "pre-commit>=3.7",
  "nbmake>=1.5",
  "build>=1.2",
  "twine>=5.1",
  "cffconvert>=2.0",
]
docs = [
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
  "mkdocs-jupyter>=0.24",
]

[project.urls]
Homepage = "https://github.com/olaflaitinen/wellcast"
Documentation = "https://olaflaitinen.github.io/wellcast"
Repository = "https://github.com/olaflaitinen/wellcast"
Issues = "https://github.com/olaflaitinen/wellcast/issues"
Changelog = "https://github.com/olaflaitinen/wellcast/blob/main/CHANGELOG.md"

[project.scripts]
wellcast = "wellcast.cli:main"

# -----------------------------------------------------------------------------
# Build
# -----------------------------------------------------------------------------

[tool.hatch.version]
path = "src/wellcast/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/wellcast"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/LICENSE",
  "/README.md",
  "/CHANGELOG.md",
  "/CITATION.cff",
  "/pyproject.toml",
]

# -----------------------------------------------------------------------------
# Testing
# -----------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "src/wellcast"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--doctest-modules",
  "--import-mode=importlib",
]
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS", "NUMBER"]
filterwarnings = ["error"]
markers = [
  "slow: long-running tests",
]

[tool.coverage.run]
source = ["wellcast"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]

# -----------------------------------------------------------------------------
# Lint and type checking
# -----------------------------------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "N", "SIM", "C4", "RUF", "NPY", "PD", "PT",
  "D",
]
ignore = [
  "D105",   # magic methods do not need docstrings
  "D107",   # __init__ is documented on the class
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"benchmarks/**" = ["D"]
"examples/**" = ["D"]
"app/**" = ["D"]
"notebooks/**" = ["D", "E402"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/wellcast"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["scipy.*", "lasio.*", "lightgbm.*", "shap.*", "sklearn.*", "joblib.*", "plotly.*", "streamlit.*"]
ignore_missing_imports = true
