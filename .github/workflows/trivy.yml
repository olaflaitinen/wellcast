# Trivy vulnerability scan of the full, resolved dependency tree of
# wellcast[all]. The repository has no lock file, so the tree is resolved and
# frozen first; the scan fails on fixable HIGH or CRITICAL vulnerabilities.

name: Trivy

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 6 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve and freeze the dependency tree
        run: |
          python -m pip install ".[all]"
          mkdir -p scan
          python -m pip freeze --exclude-editable | grep -v '^wellcast' > scan/requirements.txt
          wc -l scan/requirements.txt
      - name: Trivy scan (SARIF for code scanning)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: scan
          scanners: vuln
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Upload to code scanning
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy
      - name: Fail on fixable HIGH or CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: scan
          scanners: vuln
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
